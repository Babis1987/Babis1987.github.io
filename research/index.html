    <script>
      // Pick the language before React loads (same rule as detectLang in src/i18n/lang.ts):
      // the saved choice, else Greek for an `el` browser, else English. Sets <html lang> and,
      // on the home page (the only page with the cover), preloads the cover with the matching text.
      (function () {
        var lang = 'en'
        try {
          var saved = localStorage.getItem('lang')
          if (saved === 'en' || saved === 'el') lang = saved
          else if (/^el\b/i.test(navigator.language || '')) lang = 'el'
        } catch (e) {
          if (/^el\b/i.test(navigator.language || '')) lang = 'el'
        }
        document.documentElement.lang = lang
        if (location.pathname !== '/' && location.pathname !== '/index.html') return
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.setAttribute('fetchpriority', 'high')
        link.href = lang === 'el' ? '/images/physics-ai-cover-el.webp' : '/images/physics-ai-cover.webp'
        document.head.appendChild(link)
      })()
    </script>
